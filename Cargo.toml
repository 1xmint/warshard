[workspace]
members = ["crates/sim", "crates/server"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# deny_unknown_fields affects decoding, not the generated TypeScript shape.
ts-rs = { version = "12", features = ["no-serde-warnings"] }
