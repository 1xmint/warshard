name: Validate
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      # TEMPORARY diagnosis: restore the full browser suite before integration.
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1200x24" npm run test:e2e -- tests/controls.spec.ts --headed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
